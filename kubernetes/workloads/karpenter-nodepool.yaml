---
# EC2NodeClass defines AWS-specific infrastructure configuration
apiVersion: karpenter.k8s.aws/v1beta1
kind: EC2NodeClass
metadata:
  name: default
spec:
  amiFamily: AL2
  role: "karpenter-node-eks-gitops-production"
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: "eks-gitops-production"
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: "eks-gitops-production"
  tags:
    ManagedBy: "Karpenter"
    Intent: "DynamicScaling"

---
# NodePool sets configuration for the Kubernetes nodes
apiVersion: karpenter.sh/v1beta1
kind: NodePool
metadata:
  name: default
spec:
  template:
    spec:
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: "karpenter.k8s.aws/instance-category"
          operator: In
          values: ["t", "m", "c"]
        - key: "karpenter.sh/capacity-type"
          operator: In
          values: ["spot", "on-demand"]
      nodeClassRef:
        apiVersion: karpenter.k8s.aws/v1beta1
        kind: EC2NodeClass
        name: default
  limits:
    cpu: "100"
    memory: 100Gi
  disruption:
    consolidationPolicy: WhenUnderutilized
    expireAfter: 720h # 30 days