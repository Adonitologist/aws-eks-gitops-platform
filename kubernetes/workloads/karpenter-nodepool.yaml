---
# EC2NodeClass defines AWS-specific infrastructure configuration
# role and the discovery tag value are fixed strings: Argo CD applies this directory as plain YAML.
# They must match Terraform: role = output karpenter_node_role_name (karpenter-node-<cluster_name>),
# tag value = cluster_name (eks-gitops-<environment>). Values below are for environment=production.
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  # Pinned EKS-optimized AL2023 release; bump deliberately (alias per Kubernetes minor is resolved from the cluster)
  amiSelectorTerms:
    - alias: al2023@v20260930
  role: "karpenter-node-eks-gitops-production"
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: "eks-gitops-production"
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: "eks-gitops-production"
  tags:
    ManagedBy: "Karpenter"
    Intent: "DynamicScaling"

---
# NodePool sets configuration for the Kubernetes nodes
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: default
spec:
  template:
    spec:
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        # Only Free Tier plan eligible x86_64 types launch (see ADR 0001, row "AWS Free Tier plan")
        - key: node.kubernetes.io/instance-type
          operator: In
          values: ["m7i-flex.large", "c7i-flex.large"]
        # On-demand only: the published Free Tier policy denies Spot and ec2:CreateFleet.
        # NOT VERIFIED that it applies to this account; if CreateFleet is denied, Karpenter cannot launch nodes.
        - key: "karpenter.sh/capacity-type"
          operator: In
          values: ["on-demand"]
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      expireAfter: 720h # 30 days
  limits:
    cpu: "8"
    memory: 32Gi
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 1m
