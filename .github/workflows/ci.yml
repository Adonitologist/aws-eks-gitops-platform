name: "EKS GitOps CI/CD Pipeline"

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  id-token: write
  contents: read

jobs:
  terraform-validate-security:
    name: "Validate and Scan Infrastructure"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.0

      - name: Check Karpenter manifest names match Terraform
        run: bash scripts/ci/check-karpenter-names.sh

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3.1.2
        with:
          terraform_version: "1.15.6"

      # No backend and no AWS credentials: validate only needs the providers pinned in each lock file
      - name: Terraform Init and Validate (both stacks)
        run: |
          for stack in stacks/infra stacks/cluster; do
            terraform -chdir="$stack" init -backend=false
            terraform -chdir="$stack" validate
          done

      - name: Run TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.50.0

      - name: Init TFLint
        run: tflint --init

      - name: Run TFLint Analysis
        run: tflint -f compact --recursive

      # Pinned by commit SHA (Trivy had a supply-chain incident in 2026-03); the SHA is the peeled
      # commit of tag v0.36.0. The scanner version is set explicitly because the action default is older.
      - name: Run Trivy IaC Scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          exit-code: "1"
          hide-progress: true
          # The validate step above runs terraform init, which downloads upstream modules (with their
          # example manifests) into .terraform; those are not ours to scan. Module resolution still works.
          skip-dirs: "**/.terraform"
          version: v0.75.0

  terraform-plan:
    name: "Terraform Plan Integration"
    needs: terraform-validate-security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.0

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3.1.2
        with:
          terraform_version: "1.15.6"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4.0.2
        with:
          role-to-assume: ${{ vars.AWS_CI_ROLE_ARN }}
          role-session-name: GitHubActionsTerraformSession
          aws-region: us-east-1

      # Stage 1 only; stage 2 (stacks/cluster) is not planned in CI
      - name: Terraform Init
        working-directory: stacks/infra
        run: terraform init

      - name: Terraform Plan
        working-directory: stacks/infra
        run: terraform plan -var="environment=production" -out=tfplan
