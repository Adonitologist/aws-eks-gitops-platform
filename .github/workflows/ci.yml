name: "EKS GitOps CI/CD Pipeline"

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  id-token: write
  contents: read

jobs:
  terraform-validate-security:
    name: "Validate and Scan Infrastructure"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check Karpenter manifest names match Terraform
        run: bash scripts/ci/check-karpenter-names.sh

      # shellcheck is preinstalled on ubuntu-latest
      - name: Shellcheck teardown script
        run: shellcheck scripts/teardown/teardown-stage2.sh

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.6"

      # No backend and no AWS credentials: validate only needs the providers pinned in each lock file
      - name: Terraform Init and Validate (both stacks)
        run: |
          for stack in stacks/infra stacks/cluster; do
            terraform -chdir="$stack" init -backend=false
            terraform -chdir="$stack" validate
          done

      - name: Run TFLint
        uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.50.0

      - name: Init TFLint
        run: tflint --init

      - name: Run TFLint Analysis
        run: tflint -f compact --recursive

      # Pinned by commit SHA (Trivy had a supply-chain incident in 2026-03); the SHA is the peeled
      # commit of tag v0.36.0. The scanner version is set explicitly because the action default is older.
      - name: Run Trivy IaC Scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          exit-code: "1"
          hide-progress: true
          # The validate step above runs terraform init, which downloads upstream modules (with their
          # example manifests) into .terraform; those are not ours to scan. Module resolution still works.
          skip-dirs: "**/.terraform"
          version: v0.75.0

  terraform-plan:
    name: "Terraform Plan Integration"
    needs: terraform-validate-security
    # Dependabot runs are treated like fork PRs: read-only token, no Actions
    # secrets, and no OIDC role or repo variable is expected to be available, so
    # Configure AWS Credentials would fail. The operator runs a local plan
    # before merging a Dependabot PR.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.6"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_CI_ROLE_ARN }}
          role-session-name: GitHubActionsTerraformSession
          aws-region: us-east-1

      # Stage 1 only; stage 2 (stacks/cluster) is not planned in CI
      - name: Terraform Init
        working-directory: stacks/infra
        run: terraform init

      - name: Terraform Plan
        working-directory: stacks/infra
        run: terraform plan -var="environment=production" -out=tfplan
